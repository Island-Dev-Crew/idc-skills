name: Forge reacceptance

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  reaccept:
    name: Reaccept (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest

    steps:
      - name: Check out the exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Reaccept all fifty skills and installer profiles
        run: python -B scripts/reaccept.py

      - name: Exercise authority and integrity attack fixtures
        if: runner.os == 'Linux'
        shell: bash
        run: |
          skills/agent-guardrails/scripts/test-block-dangerous-git.sh
          scripts/test-skill-integrity.sh

      - name: Shellcheck release shell surfaces
        if: runner.os == 'Linux'
        shell: bash
        run: |
          shellcheck \
            scripts/install.sh \
            scripts/setup-signing-wizard.sh \
            scripts/test-skill-integrity.sh \
            skills/agent-guardrails/scripts/block-dangerous-git.sh \
            skills/agent-guardrails/scripts/test-block-dangerous-git.sh \
            skills/computer-use-smoke/scripts/smoke.sh \
            skills/video-analysis/scripts/grab.sh \
            skills/wizard/template.sh

      - name: Regenerate the mission report
        run: |
          python -B scripts/render_validation_report.py
          node ops/mission/render-sotu.mjs

      - name: Verify the checkout remains byte-clean
        shell: bash
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain)"
